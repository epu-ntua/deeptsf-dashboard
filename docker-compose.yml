services:
  app:
    container_name: load-forecasting-dashboard
    #    image: iccs/load-forecasting-dashboard:0.1
    restart: always
    build:
      context: "./"
    volumes:
      - ./src:/app/src
    ports:
      - '3003:3001'
    stdin_open: true
    networks:
      - nginxproxy_energyguard_net
    # environment:
    #   - REACT_APP_AUTH=False
    env_file:
      - ./.env

networks:
 nginxproxy_energyguard_net:
   external: true
